[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiboard-ml"
version = "0.1.0"
description = "Sentiment models (baseline + DistilBERT) for SentiBoard"
requires-python = ">=3.12"
# Runtime deps: what the backend needs to load models and predict.
# DistilBERT is served from model.onnx (onnxruntime + tokenizers), so no torch here.
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "onnxruntime>=1.18",  # serving DistilBERT from model.onnx (no torch needed)
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# Training, ONNX export, evaluation and notebooks; also needed to load the PyTorch
# DistilBERT folder (one without model.onnx).
train = [
    "torch>=2.4",
    "transformers>=5.0",  # train_distilbert.py uses the v5 TrainingArguments names
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=15",  # build_reddit_index.py reads the Reddit dataset parquet files
    "accelerate>=0.34",
    "onnx>=1.16",  # export_onnx.py
    "jupyter",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["sentiboard_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
